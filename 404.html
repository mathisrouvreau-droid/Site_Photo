<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <title>Page introuvable — MR VISUALS</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#080808">
    <script>
        // Cette page peut s'afficher à n'importe quelle adresse du site : on fixe la racine pour que les liens marchent partout.
        (function () {
            var base = /^\/Site_Photo(\/|$)/.test(location.pathname) ? '/Site_Photo/' : '/';
            document.write('<base href="' + base + '">');
        })();
    </script>
    <link rel="icon" type="image/png" href="images/brand/favicon.png">
    <link rel="preload" href="fonts/outfit-normal-variable-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/cormorant-garamond-normal-variable-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .nf {
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 40px 24px;
            text-align: center;
            background: radial-gradient(ellipse 60% 50% at 50% 40%, rgba(184, 148, 90, 0.10), transparent 70%);
        }
        .nf__mark { width: 84px; margin: 0 auto 30px; opacity: 0.9; }
        .nf__code { font-family: var(--font-display); font-size: clamp(6rem, 22vw, 14rem); font-weight: 300; line-height: 0.9; color: var(--accent); letter-spacing: 0.04em; }
        .nf__title { font-family: var(--font-display); font-size: clamp(1.6rem, 4vw, 2.6rem); font-weight: 300; font-style: italic; margin: 18px 0 14px; }
        .nf__text { color: var(--gray-light); max-width: 460px; margin: 0 auto 34px; }
        .nf__links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 26px; margin-top: 34px; font-size: 0.76rem; letter-spacing: 0.16em; text-transform: uppercase; }
        .nf__links a { color: var(--gray-light); border-bottom: 1px solid var(--dark-3); padding-bottom: 2px; }
        .nf__links a:hover { color: var(--accent); border-color: var(--accent-dark); }
    </style>
</head>
<body class="page-404">
    <div class="grain-overlay" aria-hidden="true"></div>

        <div>
            <img class="nf__mark" src="images/brand/mark-white.png" alt="MR VISUALS" width="84" height="51">

                <a href="gallery.html" class="btn btn--ghost"><span>Voir la galerie</span></a>

            <nav class="nf__links" aria-label="Collections">
